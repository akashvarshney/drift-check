name: Terraform Drift Check (reusable)

# -----------------------------------------------------------------------------
# Phase 1 reusable drift check.
#
# Hosted once in this repository and called by a thin `workflow_dispatch`
# wrapper inside every Terraform repository (see examples/target-repo-caller.yml),
# so the drift logic exists in exactly one place.
#
# Exit-code contract (terraform plan -detailed-exitcode):
#   0 -> no drift       : job succeeds, nothing is uploaded
#   1 -> terraform error: job FAILS so alerting fires
#   2 -> drift detected : plan is converted to JSON, filtered with jq, uploaded
#                         to Azure Blob Storage, job succeeds
#
# Azure auth is passwordless OIDC (azure/login@v2). If the state backend is
# azurerm, azure/login also exports ARM_* so `terraform init` authenticates with
# the same federated credential.
# -----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment passed to the Terraform pipeline"
        type: string
        required: true
      drift_check_only:
        description: "When true, only plan + report. This workflow never applies."
        type: boolean
        required: false
        default: true
      working_directory:
        description: "Terraform directory. {environment} is substituted at run time."
        type: string
        required: false
        default: "."
      terraform_version:
        description: "Terraform CLI version"
        type: string
        required: false
        default: "1.9.8"
      workflow_label:
        description: "Short label used in the blob name (defaults to the caller workflow name)"
        type: string
        required: false
        default: ""
      orchestrator_run_url:
        description: "Link to the orchestrator sweep that requested this run"
        type: string
        required: false
        default: ""
      blob_container:
        description: "Azure Blob Storage container"
        type: string
        required: false
        default: "drift-reports"
      blob_prefix:
        description: "Folder prefix inside the container"
        type: string
        required: false
        default: "drift-reports"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_STORAGE_ACCOUNT:
        required: true

permissions:
  contents: read
  id-token: write # required for the GitHub OIDC token exchange with Entra ID

concurrency:
  # One drift check per repo/workflow/environment at a time.
  group: drift-check-${{ github.repository }}-${{ inputs.workflow_label || github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TZ: UTC

jobs:
  drift-check:
    # This workflow is drift-only by contract; a disabled dispatch is a no-op.
    if: ${{ inputs.drift_check_only }}
    name: Drift check / ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve run context
        id: ctx
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          INPUT_WORKFLOW_LABEL: ${{ inputs.workflow_label }}
          ORCHESTRATOR_RUN_URL: ${{ inputs.orchestrator_run_url }}
        run: |
          set -euo pipefail

          # Terraform directory: replace the optional {environment} placeholder.
          working_directory="${INPUT_WORKING_DIRECTORY:-.}"
          working_directory="${working_directory//\{environment\}/$ENVIRONMENT}"
          working_directory="${working_directory%/}"
          if [ -z "$working_directory" ]; then working_directory="."; fi
          if [ ! -d "$working_directory" ]; then
            echo "::error title=Missing Terraform directory::'$working_directory' does not exist in $GITHUB_REPOSITORY for environment '$ENVIRONMENT'."
            exit 1
          fi

          # Blob-safe identifiers.
          repo_slug=$(printf '%s' "$GITHUB_REPOSITORY" | sed -e 's|/|__|g' -e 's|[^A-Za-z0-9._-]|_|g')
          label="${INPUT_WORKFLOW_LABEL:-$GITHUB_WORKFLOW}"
          label=$(printf '%s' "$label" | sed -e 's|[^A-Za-z0-9._-]|_|g')
          if [ -z "$label" ]; then label="workflow"; fi

          {
            echo "working_directory=$working_directory"
            echo "repo_slug=$repo_slug"
            echo "label=$label"
            echo "run_date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Drift check: \`$GITHUB_REPOSITORY\` / \`$label\` / \`$ENVIRONMENT\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Run | [\`$GITHUB_RUN_ID\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Terraform dir | \`$working_directory\` |"
            if [ -n "${ORCHESTRATOR_RUN_URL:-}" ]; then
              echo "| Requested by | [orchestrator sweep]($ORCHESTRATOR_RUN_URL) |"
            else
              echo "| Requested by | manual dispatch |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: ${{ steps.ctx.outputs.working_directory }}
        run: terraform init -input=false -no-color

      # ---------------------------------------------------------------------
      # plan -detailed-exitcode
      # 0 = no changes, 1 = error, 2 = changes present.
      # `set +e` keeps the shell alive so the exit code survives; the step
      # itself always succeeds and the contract is enforced in the next step.
      # ---------------------------------------------------------------------
      - name: Terraform plan (detailed exit code)
        id: plan
        working-directory: ${{ steps.ctx.outputs.working_directory }}
        env:
          PLAN_LOG: ${{ runner.temp }}/terraform-plan.log
        run: |
          set -uo pipefail
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out=tfplan.binary 2>&1 | tee "$PLAN_LOG"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "Terraform plan exit code: $rc"

      - name: Evaluate plan result
        id: result
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$EXIT_CODE" in
            0)
              echo "No drift detected - nothing to upload."
              {
                echo
                echo "**Result:** no drift. Exit code \`0\`."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "drift_detected=true" >> "$GITHUB_OUTPUT"
              echo "Drift detected - exit code 2."
              {
                echo
                echo "**Result:** drift detected. Exit code \`2\` - JSON report will be uploaded."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "::error title=Terraform plan failed (exit 1)::Terraform reported an error for '$ENVIRONMENT' in $GITHUB_REPOSITORY. See the 'Terraform plan' step log."
              {
                echo
                echo "**Result:** terraform error. Exit code \`1\` - job failed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "::error title=Unexpected terraform exit code::Received '$EXIT_CODE' (expected 0, 1 or 2)."
              exit 1
              ;;
          esac

      # ---------------------------------------------------------------------
      # Drift detected: convert the saved plan to JSON and keep only real
      # changes. `no-op` (nothing changed) and `read` (data source refresh) are
      # filtered out; every other action set (create/update/delete/replace) is
      # genuine drift.
      # ---------------------------------------------------------------------
      - name: Build drift report
        id: report
        if: steps.result.outputs.drift_detected == 'true'
        working-directory: ${{ steps.ctx.outputs.working_directory }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REPO_SLUG: ${{ steps.ctx.outputs.repo_slug }}
          LABEL: ${{ steps.ctx.outputs.label }}
          ORCHESTRATOR_RUN_URL: ${{ inputs.orchestrator_run_url }}
        run: |
          set -euo pipefail

          terraform show -json tfplan.binary > "$RUNNER_TEMP/tfplan.json"

          cat > "$RUNNER_TEMP/drift-filter.jq" <<'JQ'
          # A resource change is drift unless its action list is exactly
          # ["no-op"] (no change) or ["read"] (data source refresh).
          def is_drift:
            (.change.actions | sort) as $actions
            | ($actions != ["no-op"]) and ($actions != ["read"]);

          {
            metadata: {
              repo: $repo,
              workflow: $workflow,
              environment: $environment,
              timestamp: $timestamp,
              run_url: $run_url,
              run_id: $run_id,
              run_attempt: $run_attempt,
              commit_sha: $commit_sha,
              working_directory: $working_directory,
              orchestrator_run_url: $orchestrator_run_url,
              detected_by: "terraform-drift-detection/phase-1"
            },
            summary: {
              resource_changes_total: ((.resource_changes // []) | length),
              drifted_resources: ([(.resource_changes // [])[] | select(is_drift)] | length),
              out_of_band_drift: ([(.resource_drift // [])[] | select(is_drift)] | length)
            },
            resource_changes: [(.resource_changes // [])[] | select(is_drift)],
            resource_drift: [(.resource_drift // [])[] | select(is_drift)]
          }
          JQ

          jq -f "$RUNNER_TEMP/drift-filter.jq" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg workflow "$LABEL" \
            --arg environment "$ENVIRONMENT" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg working_directory "${{ steps.ctx.outputs.working_directory }}" \
            --arg orchestrator_run_url "${ORCHESTRATOR_RUN_URL:-}" \
            "$RUNNER_TEMP/tfplan.json" > "$RUNNER_TEMP/drift-report.json"

          drifted=$(jq -r '.summary.drifted_resources' "$RUNNER_TEMP/drift-report.json")
          out_of_band=$(jq -r '.summary.out_of_band_drift' "$RUNNER_TEMP/drift-report.json")
          echo "drifted_resources=$drifted" >> "$GITHUB_OUTPUT"
          echo "out_of_band_drift=$out_of_band" >> "$GITHUB_OUTPUT"

          if [ "$drifted" = "0" ] && [ "$out_of_band" = "0" ]; then
            echo "::warning title=Exit code 2 without resource drift::The plan reported changes but no resource-level drift survived filtering (output-only change?). Uploading the report anyway."
          fi

          {
            echo
            echo "| Metric | Count |"
            echo "| --- | --- |"
            echo "| Drifted resources | $drifted |"
            echo "| Out-of-band drift | $out_of_band |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report to Azure Blob Storage
        if: steps.result.outputs.drift_detected == 'true'
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          BLOB_CONTAINER: ${{ inputs.blob_container }}
          BLOB_PREFIX: ${{ inputs.blob_prefix }}
          ENVIRONMENT: ${{ inputs.environment }}
          REPO_SLUG: ${{ steps.ctx.outputs.repo_slug }}
          LABEL: ${{ steps.ctx.outputs.label }}
          RUN_DATE: ${{ steps.ctx.outputs.run_date }}
        run: |
          set -euo pipefail
          prefix="${BLOB_PREFIX%/}"
          blob_name="${prefix}/${RUN_DATE}/${REPO_SLUG}-${LABEL}-${ENVIRONMENT}.json"

          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$BLOB_CONTAINER" \
            --name "$blob_name" \
            --file "$RUNNER_TEMP/drift-report.json" \
            --auth-mode login \
            --overwrite \
            --content-type "application/json" \
            --metadata repo_slug="$REPO_SLUG" environment="$ENVIRONMENT" workflow="$LABEL" run_id="$GITHUB_RUN_ID" \
            --only-show-errors

          # Confirm the write actually landed (also proves the RBAC data-plane role).
          exists=$(az storage blob exists \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$BLOB_CONTAINER" \
            --name "$blob_name" \
            --auth-mode login \
            --query exists -o tsv)
          if [ "$exists" != "True" ]; then
            echo "::error title=Upload not confirmed::Blob '$blob_name' was not found after upload."
            exit 1
          fi

          echo "Uploaded $blob_name"
          {
            echo
            echo "**Report stored:** \`$BLOB_CONTAINER/$blob_name\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-log-${{ inputs.environment }}
          path: ${{ runner.temp }}/terraform-plan.log
          retention-days: 7
          if-no-files-found: ignore
