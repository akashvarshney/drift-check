name: Terraform Drift Orchestrator

# -----------------------------------------------------------------------------
# Phase 1 orchestrator.
#
#   1. prepare  : validate repos.json and flatten it into a dispatch matrix
#   2. dispatch : one job per target, calling the GitHub REST API
#                 `workflow_dispatch` endpoint on the target's DEFAULT BRANCH,
#                 on the workflow that already exists there. No caller
#                 workflow, no reusable workflow, no changes to how that
#                 pipeline authenticates or runs terraform.
#   3. verify   : polls every dispatched run to completion. A target run that
#                 failed (terraform error) or could not be identified fails the
#                 sweep, so a green sweep means every plan really ran green.
#   4. report   : summary table, always runs.
#
# Authentication: a fine-grained PAT (or GitHub App installation token) stored
# as the ORCHESTRATOR_TOKEN secret. GITHUB_TOKEN cannot dispatch workflows in
# other repositories.
# -----------------------------------------------------------------------------

on:
  schedule:
    # 02:00 UTC daily.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      repository_filter:
        description: "Optional regex - only dispatch repositories whose owner/name matches (e.g. ^acme-corp/)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Log the payloads without calling the GitHub API"
        type: boolean
        default: false

# Deny by default; each job opts in to exactly what it needs.
permissions: {}

# A sweep can take a while. Never run two at once, and never cancel a half
# finished sweep (that would leave dispatches unaccounted for).
concurrency:
  group: drift-orchestrator-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG_FILE: repos.json

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    steps:
      - name: Check out configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            repos.json
            scripts/
          sparse-checkout-cone-mode: false

      - name: Validate repos.json
        run: |
          set -euo pipefail
          jq -e . "$CONFIG_FILE" > /dev/null
          jq -e '
            def nonempty_string: type == "string" and length > 0;

            (.repositories | type) == "array"
            and (.repositories | length) > 0
            and ([.repositories[] | select((.repo // "") == "")] | length) == 0
            and ([.repositories[]
                  | select(.enabled != false)
                  | select(((.workflows // []) | length) == 0)] | length) == 0
            and ([.repositories[] | (.workflows // [])[] | select((.file // "") == "")] | length) == 0
            and ([.repositories[]
                  | select(.enabled != false)
                  | (.workflows // [])[]
                  | select(.disabled != true)
                  | select(((.targets // []) | length) == 0)] | length) == 0
            and ([.repositories[] | (.workflows // [])[] | (.targets // [])[]
                  | select((.dispatch_inputs | type) != "object"
                           or (((.dispatch_inputs.environment // "") | nonempty_string) | not))] | length) == 0
          ' "$CONFIG_FILE" > /dev/null || {
            echo "::error file=repos.json::repos.json failed validation - every entry needs a repo, every enabled repo needs at least one workflow with a file, every enabled workflow needs at least one target, and every target needs dispatch_inputs with a non-empty environment."
            exit 1
          }

      - name: Build dispatch matrix
        id: matrix
        env:
          REPOSITORY_FILTER: ${{ inputs.repository_filter }}
        run: |
          set -euo pipefail
          # One row per target. dispatch_inputs is passed to workflow_dispatch
          # verbatim, so what repos.json says is exactly what the target gets.
          matrix=$(jq -c --arg filter "${REPOSITORY_FILTER:-}" '
            . as $root
            | ($root.defaults.default_branch // "main") as $fallback_branch
            | [
                $root.repositories[]?
                | select(.enabled != false)
                | . as $repo_entry
                | ($repo_entry.workflows // [])[]
                | select(.disabled != true)
                | . as $workflow
                | ($workflow.targets // [])[]
                | {
                    repo: $repo_entry.repo,
                    ref: ($repo_entry.default_branch // $fallback_branch),
                    workflow_file: $workflow.file,
                    workflow_label: ($workflow.label // ($workflow.file | gsub("\\.ya?ml$"; ""))),
                    environment: (.dispatch_inputs.environment // "unknown"),
                    dispatch_inputs: .dispatch_inputs
                  }
              ]
            # Dedupe on the full input set: two targets that dispatch the same
            # workflow with identical inputs would otherwise create ambiguous runs.
            | unique_by([.repo, .workflow_file, .workflow_label, (.dispatch_inputs | tojson)] | join("|"))
            | map(select($filter == "" or (.repo | test($filter))))
          ' "$CONFIG_FILE")

          count=$(jq 'length' <<< "$matrix")

          max_parallel=$(jq -r '.defaults.max_parallel // 1' "$CONFIG_FILE")
          if ! [[ "$max_parallel" =~ ^[0-9]+$ ]]; then
            echo "::warning::defaults.max_parallel is not an integer - falling back to 1"
            max_parallel=1
          fi
          # Keep the fan-out polite: 1..10 concurrent dispatches.
          if (( max_parallel < 1 )); then max_parallel=1; fi
          if (( max_parallel > 10 )); then max_parallel=10; fi

          {
            echo "matrix=$matrix"
            echo "count=$count"
            echo "max_parallel=$max_parallel"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Drift sweep prepared"
            echo
            echo "- Config: \`$CONFIG_FILE\`"
            echo "- Dispatch targets: **$count**"
            echo "- Max parallel: **$max_parallel**"
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    name: Dispatch ${{ matrix.repo }} / ${{ matrix.workflow_label }} / ${{ matrix.environment }}
    needs: prepare
    # An empty matrix is a hard error in Actions, so skip cleanly instead.
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # artifact upload for the run info hand-off
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out dispatch helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/
          sparse-checkout-cone-mode: false

      - name: Trigger workflow_dispatch
        env:
          # Fine-grained PAT with "Actions: write" on every target repository.
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_REF: ${{ matrix.ref }}
          WORKFLOW_FILE: ${{ matrix.workflow_file }}
          WORKFLOW_LABEL: ${{ matrix.workflow_label }}
          DISPATCH_INPUTS: ${{ toJSON(matrix.dispatch_inputs) }}
          ORCHESTRATOR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash scripts/dispatch-drift-check.sh

      - name: Upload dispatched run info
        # Runs even when the dispatch step failed: the verify job distinguishes
        # "run failed" from "run never identified" from the recorded data.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-run-${{ strategy.job-index }}
          path: ${{ runner.temp }}/run-info/*.json
          retention-days: 3
          if-no-files-found: ignore

  verify:
    name: Verify dispatched runs
    needs: [prepare, dispatch]
    # Verification is the point of the sweep: poll every dispatched run instead
    # of trusting that the dispatch was accepted.
    if: ${{ always() && !inputs.dry_run && needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    # Covers MAX_WAIT_SECONDS (default 3600) plus scheduling overhead.
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Check out verification helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/
          sparse-checkout-cone-mode: false

      - name: Download dispatched run info
        # A failed dispatch leaves no artifact; the script reports that with a
        # better message than this action would.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: drift-run-*
          path: ${{ runner.temp }}/runs
          merge-multiple: true

      - name: Poll dispatched runs
        env:
          # Fine-grained PAT with "Actions: read" on every target repository.
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
          RUNS_DIR: ${{ runner.temp }}/runs
          EXPECTED: ${{ needs.prepare.outputs.count }}
          DISPATCH_RESULT: ${{ needs.dispatch.result }}
          # Override with a repository/org variable if plans legitimately run
          # longer than an hour.
          MAX_WAIT_SECONDS: ${{ vars.DRIFT_VERIFY_TIMEOUT_SECONDS || '3600' }}
          POLL_INTERVAL_SECONDS: "20"
        run: bash scripts/await-drift-runs.sh

  report:
    name: Sweep summary
    needs: [prepare, dispatch, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write summary
        env:
          TARGETS: ${{ needs.prepare.outputs.count }}
          DISPATCH_RESULT: ${{ needs.dispatch.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ORCHESTRATOR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "### Drift sweep result"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Dispatch targets | ${TARGETS:-0} |"
            echo "| Dispatch job result | ${DISPATCH_RESULT:-skipped} |"
            echo "| Verification job result | ${VERIFY_RESULT:-skipped} |"
            echo "| Orchestrator run | ${ORCHESTRATOR_RUN_URL} |"
            echo
            echo "Drift reports are written by each target run to \`<container>/drift-reports/YYYY-MM-DD/\`"
            echo "in the storage account that target pipeline already uses."
            echo "A green sweep means every dispatched target run finished green -"
            echo "see the \`Verify dispatched runs\` job for the per-target table."
          } >> "$GITHUB_STEP_SUMMARY"
